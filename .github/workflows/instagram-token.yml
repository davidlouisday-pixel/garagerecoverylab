# Instagram long-lived tokens expire after 60 days. This renews IG_TOKEN every Sunday and saves it back
# as the repo secret. Needs SECRETS_PAT: a fine-grained token for this repo with "Secrets: read and write".
# Does nothing until both secrets exist.
name: Renew Instagram token
on:
  schedule:
    - cron: '17 9 * * 0' # Sundays 09:17 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Renew
        id: renew
        if: env.IG_TOKEN != '' && env.GH_TOKEN != ''
        run: node scripts/post-instagram.mjs --refresh
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
      - name: Save the renewed token
        if: steps.renew.outputs.token != ''
        run: gh secret set IG_TOKEN --body "${{ steps.renew.outputs.token }}" --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
