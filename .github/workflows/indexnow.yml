# After each push to main, wait for Cloudflare to deploy it, then tell IndexNow which pages changed.
name: IndexNow
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for the Cloudflare deploy
        run: |
          # Cloudflare's Workers build for main reports a check run on this commit.
          for i in $(seq 1 40); do
            state=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs \
              -q '[.check_runs[] | select(.name | startswith("Workers Builds")) | .conclusion] | first // "pending"')
            echo "attempt $i: $state"
            if [ "$state" = "success" ]; then exit 0; fi
            if [ "$state" = "failure" ] || [ "$state" = "cancelled" ]; then echo "Deploy failed, not pinging."; exit 1; fi
            sleep 30
          done
          echo "Timed out waiting for the deploy."; exit 1
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Ping IndexNow
        run: node scripts/indexnow.mjs "${{ github.event.before }}" "${{ github.sha }}"
