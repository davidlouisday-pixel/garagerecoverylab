# Renders the Pinterest rotation pins for guides changed in a pull request and attaches them to the
# run as an artifact, so the designs can be checked before merge. Nothing is committed.
name: Pin preview
on:
  pull_request:
    paths:
      - 'src/content/articles/**'
      - 'scripts/make-auto-pins.mjs'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render pins
        run: |
          npm ci --no-audit --no-fund
          npm i --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base" HEAD | grep -q '^scripts/make-auto-pins.mjs$'; then only=""; else
            only=$(git diff --name-only --diff-filter=AM "$base" HEAD -- src/content/articles | xargs -r -n1 basename | sed 's/\.md$//' | grep -v '^_' | paste -sd, -)
          fi
          node scripts/make-auto-pins.mjs --force --sheet --out pin-preview ${only:+--only "$only"}
      - uses: actions/upload-artifact@v4
        with:
          name: pin-preview
          path: pin-preview
