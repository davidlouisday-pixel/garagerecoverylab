# Scheduled releases. Guides with a future `published:` date are left out of the build until that day.
# Each morning this renders any missing Pinterest rotation pins, records today's guide releases in
# RELEASES.md, and pushes to main every day, which makes Cloudflare rebuild the site so new guides
# and the day's scheduled pins (src/data/pins.ts) go out. Then it pings IndexNow for new guides and posts
# each new guide's carousel (public/ig/<slug>/) to Instagram.
name: Scheduled release
on:
  schedule:
    - cron: '0 11 * * *' # 11:00 UTC, 6 AM Eastern
  workflow_dispatch:
permissions:
  contents: write
  checks: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Find guides going live today
        id: due
        run: |
          today=$(date -u +%F)
          slugs=$(grep -l -E "^published: ${today}\s*$" src/content/articles/*.md | xargs -r grep -L -E '^draft: true' | xargs -r -n1 basename | sed 's/\.md$//' | grep -v '^_' | paste -sd, -)
          echo "today=$today" >> "$GITHUB_OUTPUT"
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"
          echo "Due today: ${slugs:-none}"
      - name: Render missing Pinterest pins
        run: |
          npm ci --no-audit --no-fund
          npm i --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
          node scripts/make-auto-pins.mjs
      - name: Render missing Instagram carousels
        # Never blocks the release: a guide whose carousel fails is retried the next morning.
        continue-on-error: true
        run: node scripts/make-carousels.mjs
      - name: Record the day and push
        run: |
          today="${{ steps.due.outputs.today }}"
          slugs="${{ steps.due.outputs.slugs }}"
          if [ -n "$slugs" ] && ! grep -q "^- ${today}:" RELEASES.md 2>/dev/null; then
            echo "- ${today}: ${slugs}" >> RELEASES.md
          fi
          # A daily change so Cloudflare rebuilds even on days with no guide, which airs the day's pins.
          echo "$today" > .github/last-rebuild
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RELEASES.md .github/last-rebuild public/pins/auto public/ig
          git diff --cached --quiet && { echo "Nothing to push."; exit 0; }
          git commit -m "Daily rebuild ${today}${slugs:+: release ${slugs}}"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Wait for the Cloudflare deploy
        if: env.sha != ''
        run: |
          for i in $(seq 1 40); do
            state=$(gh api repos/${{ github.repository }}/commits/$sha/check-runs \
              -q '[.check_runs[] | select(.name | startswith("Workers Builds")) | .conclusion] | first // "pending"')
            echo "attempt $i: $state"
            if [ "$state" = "success" ]; then exit 0; fi
            if [ "$state" = "failure" ] || [ "$state" = "cancelled" ]; then echo "Deploy failed."; exit 1; fi
            sleep 30
          done
          echo "Timed out waiting for the deploy."; exit 1
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Ping IndexNow
        if: env.sha != '' && steps.due.outputs.slugs != ''
        run: node scripts/indexnow.mjs --slugs "${{ steps.due.outputs.slugs }}"
      - name: Post today's guides to Instagram
        # Skips itself until the IG_TOKEN secret exists, and never fails the release.
        if: env.sha != '' && steps.due.outputs.slugs != ''
        continue-on-error: true
        run: node scripts/post-instagram.mjs --slugs "${{ steps.due.outputs.slugs }}"
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
